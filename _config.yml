# Conference Website — Jekyll Template

title: "Conference 202X"
subtitle: "25th International Conference on the topic of the conferenceConference 202X: 25th International Conference on the topic of the conference."
email: "contact@conference.org"
description: >-
  Conference 202X: 25th International Conference on the topic of the conference.

conference:
  name: "International Conference on the topic of the conference"
  edition: "25th"
  acronym: "IDA 2027"
  year: 2027
  location: "Pisa, Italy"
  dates: "Month d1-d2, 202X"
  topic: "Intelligent Data Analysis"

markdown: kramdown

remote_theme: "dieghernan/chulapa"

theme: chulapa-jekyll

repository: false

github:
  is_project_page: false

navbar:
  style: dual
  brand:
    title: ""
    img: "./assets/images/conference-logo-white.svg"
    url: /
  nav:
    - title: Home
      url: /
    - title: Submissions
      child:
        - title: Why Submit?
          url: /why-submit/
        - title: Regular Paper Track
          url: /regular-paper-track/
        - title: PhD Forum
          url: /phd-forum/
    - title: Programme
      child:
        - title: Programme Overview
          url: /programme-overview/
        - title: Accepted Papers
          url: /accepted-papers/
        - title: Invited Speakers
          url: /invited-speakers/
        - title: Social Programme
          url: /social-programme/
    - title: Organization
      child:
        - title: Chairs
          url: /chairs/
    - title: Attending
      child:
        - title: Venue & Travel
          url: /venue-and-travel/
        - title: Registration
          url: /registration/
    - title: Submission System
      url: https://example.com/conference-submission/
      target: _blank

googlefonts:
  - url: "https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&display=swap"

chulapa-skin:
  skin: "graymor"
  vars:
    body-color: "#000"
    body-bg: "#fff"
    footer-chulapa-bg-color: "#000"
    footer-chulapa-text-color: "#fff"
    navbar-chulapa-bg-color: "#000"
    navbar-chulapa-text-color: "#fff"
    primary: "#000"
    link-color: "#e87722"
    link-hover-color: "#e87722"
    link-decoration: "underline"
    headings-font-family: "open sans, sans-serif"

##################################################
#    System Configuration (DO NOT MODIFY)
##################################################

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

collections:
  pages:
    output: true
    permalink: /:path

footer:
  links:
    - label: "Bluesky"
      icon: "fab fa-bluesky"
      url: "https://bsky.app/profile/conference.bsky.social"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/groups/conference/"
    - label: "Facebook"
      icon: "fab fa-facebook"
      url: "https://www.facebook.com/conference/"
  copyright: "202X - Conference Website"

sass:
  quiet_deps: true

exclude:
 - .sass-cache/
 - .jekyll-cache/
 - gemfiles/
 - Gemfile
 - Gemfile.lock
 - node_modules/
 - vendor/bundle/
 - vendor/cache/
 - vendor/gems/
 - vendor/ruby/
 - .idea/

include:
  - .nojekyll

livereload: true
baseurl: ""
url: ""
pure_relative_paths: false
